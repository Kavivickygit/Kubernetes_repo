apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
  labels:
    app: my-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      containers:
      - name: my-web-app
        image: kavivickydocker/my-web-app:a18715ac2805fb7e83053362a086434d6f0ee38a
        imagePullPolicy: Always
        ports:
        - containerPort: 80
