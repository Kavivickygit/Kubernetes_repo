
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
  labels:
    app: my-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      containers:
        - name: my-web-app
          image: kavivickydocker/my-web-app:748d7f15b399dba276229127d91f1f7d1ed86994
          imagePullPolicy: Always
          ports:
            - containerPort: 80

